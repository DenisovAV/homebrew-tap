# Builds and tests the formula on a clean runner.
#
# The machine this was written on could not: its Command Line Tools were too
# old for Homebrew to build from source, so `brew install` failed on the
# environment and said nothing about the formula. An untested formula that
# looks fine is exactly the thing this project refuses to ship elsewhere.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Formulae rot without being touched: the sdist stays put, but Homebrew's
  # default python moves, and litetune pins python@3.12 for a reason.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # `brew audit [path]` is disabled -- it takes a name, and a name only
      # exists inside a tap. Linking the checkout into place tests *this*
      # commit rather than whatever is on the remote, which matters for pull
      # requests.
      - name: Link the checkout in as the tap
        run: |
          taps="$(brew --repository)/Library/Taps/denisovav"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew tap | grep denisovav

      - name: Audit
        run: brew audit --strict denisovav/tap/litetune

      # The macOS runner image ships openssl@1.1, which owns
      # /opt/homebrew/bin/openssl. When an openssl@3 revision lands without a
      # matching runner image, python@3.12 upgrades it as a dependency, its
      # `brew link` cannot take bin/openssl, and `brew install` exits 1 after
      # installing litetune -- reported only as an annotation. Nothing here uses
      # openssl@1.1.
      - name: Unlink the runner's openssl@1.1
        if: runner.os == 'macOS'
        run: |
          if brew list --formula openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi

      - name: Build from source
        run: brew install --build-from-source --verbose denisovav/tap/litetune

      - name: Test
        run: brew test --verbose denisovav/tap/litetune

      # The formula's own test asserts --version and the exit code; this
      # asserts the thing a user actually types first.
      - name: It runs
        run: |
          litetune --version
          litetune --help | head -3
